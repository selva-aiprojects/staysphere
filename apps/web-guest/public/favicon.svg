<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ss_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001428" />
      <stop offset="100%" stop-color="#002B4D" />
    </linearGradient>
    <linearGradient id="ss_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2C4" />
      <stop offset="50%" stop-color="#00A9A5" />
      <stop offset="100%" stop-color="#3CCF91" />
    </linearGradient>
    <linearGradient id="ss_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF8A3D" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#ss_bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#ss_teal)" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Outer Orbit -->
  <circle cx="32" cy="32" r="20" stroke="url(#ss_teal)" stroke-width="2.5" stroke-dasharray="2 3" stroke-opacity="0.6" />
  
  <!-- Primary Sphere Arc -->
  <circle cx="32" cy="32" r="14" stroke="url(#ss_teal)" stroke-width="3.5" />
  
  <!-- Inner Horizon Orbit -->
  <ellipse cx="32" cy="32" rx="14" ry="5.5" stroke="url(#ss_gold)" stroke-width="2.5" />
  
  <!-- Center Sovereign Core Star -->
  <circle cx="32" cy="32" r="4" fill="url(#ss_teal)" />
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" />
</svg>
